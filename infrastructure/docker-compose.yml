version: '3.9'

# Kafka removed — replaced with Redis Streams (same Redis instance).
# Local dev: only 3 containers needed now instead of 5.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ride_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rideapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ride_redis
    ports:
      - '6379:6379'
    # appendonly: persists Redis Streams across restarts
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: ride_mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: rideapp
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
