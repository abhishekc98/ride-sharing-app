name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "@ride/shared-types" build

      - name: Type-check
        run: pnpm type-check

  build-apps:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        app: [web, driver-web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm --filter "@ride/${{ matrix.app }}" build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_DEV_BYPASS_OTP: 'true'

  # Deployment (3 services, see render.yaml):
  #   services/api/             → merged Node.js API (all 9 services)
  #   services/websocket-hub/   → Socket.io hub
  #   services/pricing-service/ → Python FastAPI
  # All 3 are Render Docker web services that build straight from their own
  # Dockerfile on every push to main (Render Blueprint sync). No image is
  # ever published to a registry, so there is no build-and-push job here.
